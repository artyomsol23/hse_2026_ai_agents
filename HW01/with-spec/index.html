<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Мини-трекер учебных задач</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1 class="app__title">Мини-трекер учебных задач</h1>

      <section class="metrics" aria-label="Итоги">
        <div class="metric">
          <span class="metric__label">Всего</span>
          <span class="metric__value" id="total-hours">0 ч</span>
        </div>
        <div class="metric">
          <span class="metric__label">Выполнено</span>
          <span class="metric__value" id="done-hours">0 ч</span>
        </div>
        <div class="metric">
          <span class="metric__label">Прогресс</span>
          <span class="metric__value" id="progress">0%</span>
        </div>
      </section>

      <form class="form" id="task-form" novalidate>
        <div class="field">
          <label class="field__label" for="title">Название</label>
          <input class="field__input" id="title" name="title" type="text" autocomplete="off" />
          <span class="field__error" id="title-error" role="alert"></span>
        </div>

        <div class="field">
          <label class="field__label" for="hours">Часы</label>
          <input
            class="field__input"
            id="hours"
            name="hours"
            type="number"
            min="0.5"
            max="24"
            step="0.5"
            inputmode="decimal"
          />
          <span class="field__error" id="hours-error" role="alert"></span>
        </div>

        <button class="form__submit" type="submit">Добавить</button>
      </form>

      <fieldset class="filters">
        <legend class="filters__legend">Фильтр</legend>
        <label class="filters__option">
          <input type="radio" name="filter" value="all" checked />
          Все
        </label>
        <label class="filters__option">
          <input type="radio" name="filter" value="active" />
          Активные
        </label>
        <label class="filters__option">
          <input type="radio" name="filter" value="done" />
          Готовые
        </label>
      </fieldset>

      <ul class="tasks" id="task-list"></ul>
      <p class="empty" id="empty-state" hidden>Задач нет. Добавьте первую задачу.</p>

      <p class="storage-warning" id="storage-warning" role="status" hidden></p>
    </main>

    <script type="module" src="app.mjs"></script>
  </body>
</html>
