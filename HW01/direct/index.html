<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Мини-трекер учебных задач</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Мини-трекер учебных задач</h1>
        <p class="subtitle">План на неделю: от 0,5 до 24 часов на задачу.</p>
      </header>

      <section class="summary" aria-labelledby="summary-title">
        <h2 id="summary-title" class="visually-hidden">Общий прогресс</h2>
        <dl class="stats">
          <div class="stat">
            <dt>Всего</dt>
            <dd id="total-hours">8 ч</dd>
          </div>
          <div class="stat">
            <dt>Выполнено</dt>
            <dd id="done-hours">2 ч</dd>
          </div>
          <div class="stat">
            <dt>Прогресс</dt>
            <dd id="progress-value">25%</dd>
          </div>
        </dl>
        <div
          class="progress"
          id="progress"
          role="progressbar"
          aria-label="Прогресс выполнения задач"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="25"
        >
          <div class="progress__bar" id="progress-bar" style="width: 25%"></div>
        </div>
      </section>

      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title">Новая задача</h2>
        <form id="task-form" novalidate>
          <div class="field">
            <label for="title">Название</label>
            <input
              id="title"
              name="title"
              type="text"
              autocomplete="off"
              maxlength="80"
              aria-describedby="title-error"
            />
            <p class="error" id="title-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="hours">Часы</label>
            <input
              id="hours"
              name="hours"
              type="number"
              inputmode="decimal"
              min="0.5"
              max="24"
              step="0.5"
              aria-describedby="hours-hint hours-error"
            />
            <p class="hint" id="hours-hint">От 0,5 до 24, шаг 0,5.</p>
            <p class="error" id="hours-error" role="alert"></p>
          </div>

          <div class="form-actions">
            <button type="submit" class="button button--primary">Добавить</button>
            <button type="button" id="reset-data" class="button">Вернуть исходные данные</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="tasks-title">
        <div class="list-header">
          <h2 id="tasks-title">Задачи</h2>
          <div class="filters" role="group" aria-label="Фильтр задач">
            <button type="button" class="filter" data-filter="all" aria-pressed="true">Все</button>
            <button type="button" class="filter" data-filter="active" aria-pressed="false">
              Активные
            </button>
            <button type="button" class="filter" data-filter="done" aria-pressed="false">
              Готовые
            </button>
          </div>
        </div>

        <ul id="task-list" class="task-list"></ul>
        <p id="list-empty" class="empty" hidden></p>
      </section>

      <p id="announcer" class="visually-hidden" aria-live="polite"></p>
    </main>

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
